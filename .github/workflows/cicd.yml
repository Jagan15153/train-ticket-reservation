name: ci pipeline to build maven
on:
   push:
      branches:master
  jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
          -name: checkout code
           uses: actions/checkout@v4
          -name: set-up jdk
           uses: action/setup-java@
           with:
              distributions: "temurin"
              java-version: '17'
          - name: validate with maven
             run: mvn validate
            
          - name: compile with maven
             run: mvn compile
            
          - name: test with maven
             run: mvn test

          - name: package with maven
            run: mvn package

          - name: verify the war file
             run: ls -lh/target
